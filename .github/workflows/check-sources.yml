name: Check sources

# Opt-in, scheduled, never a PR gate -- same shape as check-links.yml.
#
# This fetches every program's source.url, reduces each page to its meaningful
# text (scripts/check-sources/lib/normalize.ts), hashes it, and compares against
# the committed baseline in scripts/check-sources/source-hashes.json. When a
# page's text has moved -- or 404'd, or gone unreachable for two runs running --
# it opens (or updates) a single pull request that advances the baseline and
# carries the report as its body. That PR is the "tracked item" from issue #7: a
# human re-verifies the flagged records against docs/data-authoring.md's
# re-verification loop, then either sets a fresh lastVerified or lands the
# correction, on top of the baseline bump.
#
# An all-unchanged run does nothing and says nothing -- no PR, no noise. A run
# whose only change is a first-time unreachable's failure counter commits that
# one field straight to main as bookkeeping and opens no PR (issue #49) -- the
# escalation to an actual PR happens if the next run also fails. Monthly is
# enough: steady-state change on these sources is roughly annual (see
# docs/eligibility-extraction.md Section 5), and stalePrograms() covers the
# time-based half between runs.
on:
  schedule:
    - cron: '0 14 1 * *' # 1st of the month, 14:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-sources:
    name: Detect changed source pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the "Advance the baseline" step can fast-forward /
          # rebase a bookkeeping commit onto main without shallow-clone surprises.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # actions/checkout leaves a detached HEAD, so the script's "never write on
      # main" guard does not trip here -- it writes source-hashes.json into the
      # workspace, and the git diff below is what decides whether that matters.
      - name: Check sources
        id: check
        run: |
          set +e
          npm run check:sources -- --report-file="$RUNNER_TEMP/report.md"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 = all clean OR only a first-time unreachable's failure counter moved
          # (bookkeeping -- committed to main below, no PR); 2 = something is
          # changed / gone / unreachable-for-N-runs (the PR step handles it).
          # Anything else (crash, or the on-main write guard, which shouldn't
          # trip on a detached HEAD) is a real failure.
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then
            echo "::error::check:sources exited $code"
            exit "$code"
          fi

      - name: Advance the baseline
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/source-change-detection
          CHECK_CODE: ${{ steps.check.outputs.code }}
        run: |
          if git diff --quiet -- scripts/check-sources/source-hashes.json; then
            echo "No baseline change. Nothing to do."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$CHECK_CODE" != "2" ]; then
            # The only change is transient-failure bookkeeping: a `consecutiveFailures`
            # counter for a source that failed to fetch once (a timeout / 403 / 5xx
            # blip). No page text moved, nothing 404'd -- there is nothing for a human
            # to re-verify, so opening a PR would just be the monthly noise issue #49
            # set out to remove. But escalation to a real re-verification PR happens on
            # the SECOND consecutive failed run, and that needs the counter persisted
            # where the next scheduled run (which checks out main) can see it. So this
            # commits the counter straight to main. It only ever touches
            # `consecutiveFailures`; the last-good hash is untouched, and a successful
            # fetch next run resets it. This is operational state, not program data --
            # the "PR review is the write gate" rule still holds for every `changed` /
            # `gone` / escalated finding, which all take the branch path below.
            git add scripts/check-sources/source-hashes.json
            git commit -m "check-sources: transient-fetch bookkeeping $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "push to main rejected (attempt $attempt); rebasing"
              git fetch origin main
              git rebase origin/main || { git rebase --abort; echo "::error::could not rebase bookkeeping commit onto main"; exit 1; }
            done
            echo "::error::could not push transient-fetch bookkeeping to main after 3 attempts"
            exit 1
          fi

          git checkout -B "$BRANCH"
          git add scripts/check-sources/source-hashes.json
          git commit -m "Source change detection: baseline update $(date -u +%Y-%m-%d)"
          git push --force origin "$BRANCH"

          if gh pr list --head "$BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create \
              --base main --head "$BRANCH" \
              --title "Source change detection: re-verify flagged records" \
              --body-file "$RUNNER_TEMP/report.md"
          else
            echo "PR already open for $BRANCH; the force-push above updated it."
            gh pr comment --body-file "$RUNNER_TEMP/report.md" "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          fi

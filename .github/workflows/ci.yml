name: CI

# The full gate: every suite runs on every PR and on every push to main.
# Cloudflare Pages deploys from main via its own GitHub integration,
# independent of this workflow -- branch protection on main (requiring this
# check to pass before merge) is what actually gates a deploy. See
# docs/deploy.md, "Branch protection" for why that's owner setup this
# workflow cannot do on its own, and what it does and doesn't cover.
#
# Steps are ordered cheapest/fastest-fail first, so a broken PR fails in
# seconds (typecheck) rather than minutes (a full browser matrix). Node's
# built-in test runner (test:refresh-income-tables) gets its own step, kept
# separate from `npm test` (vitest) on purpose -- they are two different
# runners over two different sets of tests, and a failure should say which
# one broke, not just "tests failed".
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the 24.x line the app was actually developed and verified
      # against, not the current LTS -- two npm scripts
      # (refresh:income-tables, test:refresh-income-tables) run .ts files
      # directly via Node's native TypeScript type-stripping rather than a
      # transpile step, deliberately, so scripts/refresh-income-tables (#6)
      # needs zero new dependencies (no tsx, no build step). That behaviour
      # is absent or flag-gated on Node 22, so pinning to LTS would fail
      # test:refresh-income-tables below for a version reason, not a code
      # reason. Verified locally: 19/19 pass on the .nvmrc version. Keep
      # .nvmrc, this step, and Cloudflare Pages' NODE_VERSION build variable
      # (docs/deploy.md) all in agreement -- see docs/deploy.md for the full
      # explanation of why this isn't just "use LTS".
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `npm run typecheck` above is `tsc -b` over the app's project references
      # only -- it never reaches scripts/. Each script directory has its own
      # scoped tsconfig (its own moduleResolution, its own src/ access, its own
      # `typecheck:*` script) and none of them ran in CI until issue #48. The
      # scripts execute via Node's TypeScript type-stripping, which removes
      # annotations without checking them, so a script can be badly type-broken
      # and still run green. These steps close that gap.
      #
      # One step per directory rather than an aggregate `typecheck:scripts`, for
      # the same reason the two test runners below are split: a red X should name
      # the directory that broke, not just report "scripts don't typecheck".
      # They are pure static analysis over a handful of files each -- cheap, and
      # placed here so a type error fails the PR in seconds.
      - name: Typecheck (scripts/build-snapshot)
        run: npm run typecheck:build-snapshot
      - name: Typecheck (scripts/refresh-income-tables)
        run: npm run typecheck:refresh-income-tables
      - name: Typecheck (scripts/llm-extraction)
        run: npm run typecheck:llm-extraction
      - name: Typecheck (scripts/program-benchmark)
        run: npm run typecheck:program-benchmark
      - name: Typecheck (scripts/agentic-extract)
        run: npm run typecheck:agentic-extract
      - name: Typecheck (scripts/check-sources)
        run: npm run typecheck:check-sources
      - name: Typecheck (scripts/ingest-descriptive)
        run: npm run typecheck:ingest-descriptive
      - name: Typecheck (scripts/render-fallback)
        run: npm run typecheck:render-fallback

      # Typechecking the scripts (above) is necessary but not sufficient, and
      # issue #55 is the post-mortem of the gap it leaves. #8 made
      # src/data/programs/index.ts do a bare `import rawSnapshot from
      # './snapshot.json'`. That is valid TypeScript, and Vite loads it fine --
      # so every typecheck, every vitest suite, and `npm run build` stayed
      # green. But scripts/check-sources and scripts/ingest-descriptive reach
      # PROGRAMS through Node's raw ESM loader (scripts/check-sources/resolve-hook.mjs),
      # and Node requires a `with { type: 'json' }` import attribute that Vite
      # does not. Both scripts broke at startup the moment #8 merged and stayed
      # broken -- green everywhere -- for roughly 26 days, because the only thing
      # that runs them (check-sources.yml) is monthly and deliberately not a PR
      # gate.
      #
      # Fix: actually START every scripts/ entrypoint on every PR. Each has a
      # no-network mode that evaluates its whole module graph, parses argv, and
      # exits 0 -- `--self-test` for the three fetching scripts, and `--check`
      # for build-snapshot, which already loaded its source modules through Vite
      # and validated the committed snapshot without a network. No live source
      # is fetched here, on purpose: a PR gate that hit 17 government sites on
      # every push is the exact noise check-links.yml exists to keep out of CI.
      # These are smoke tests -- "does it start?" -- not a second test suite.
      # (build:snapshot:check runs again inside the Build step below; the few
      # seconds here buy a fast, clearly-named failure near the front.)
      - name: 'Smoke test: scripts/check-sources starts (issue #55)'
        run: npm run check:sources:self-test
      - name: 'Smoke test: scripts/ingest-descriptive starts (issue #55)'
        run: npm run ingest:descriptive:self-test
      # program-benchmark's self-test does more than "does it start": it runs
      # the scorer over the real dataset with the verified-echo and abstain-all
      # diagnostic extractors (no model, no network) and asserts the scoring
      # invariants. See scripts/program-benchmark/index.ts.
      - name: 'Smoke test: scripts/program-benchmark scores offline (issue #66)'
        run: npm run eval:program-extraction:self-test
      # agentic-extract's self-test drives the full agent loop with a scripted
      # model transcript + fixture fetcher (no network, no model): 404 recovery,
      # table-structure preservation, the eCFR versioner cross-reference with its
      # Accept-Encoding header, verbatim provenance (incl. the cross-ref URL),
      # step-budget abstention, issue #77's linked PDF income table read as a
      # table (against a committed Federal Register fixture, zero network) plus a
      # dead PDF link abstaining cleanly, and -- issue #75 -- the site-scoped
      # search tool locating a page unreachable from the entry URL (against
      # committed dhs.wisconsin.gov captures) and that page flowing through the
      # provenance gate unchanged. See scripts/agentic-extract/index.ts.
      - name: 'Smoke test: scripts/agentic-extract runs offline (issue #67)'
        run: npm run extract:agentic:self-test
      - name: 'Smoke test: scripts/refresh-income-tables starts (issue #55)'
        run: npm run refresh:income-tables:self-test
      # render-fallback's self-test does more than "does it start": it runs the
      # ASP.NET/SharePoint form-shell unwrap over synthetic shells AND the two
      # real energyandhousing.wi.gov fixtures (tests/fixtures/js-pages), asserts
      # plain normalize/renderStructured come back empty and recovery makes them
      # rich with table + heading structure intact, and checks the headless-browser
      # step is reached only under --allow-browser and degrades cleanly. No
      # network, no browser, no model. See scripts/render-fallback/index.ts.
      - name: 'Smoke test: scripts/render-fallback recovers empty pages offline (issue #76)'
        run: npm run render-fallback:self-test
      - name: 'Smoke test: scripts/build-snapshot starts (issue #55)'
        run: npm run build:snapshot:check

      - name: Unit tests (vitest)
        run: npm test

      - name: Unit tests (Node test runner -- scripts/refresh-income-tables)
        run: npm run test:refresh-income-tables

      # Also Node's test runner, also deterministic and network-free (the
      # fetcher is injected). This is where scripts/check-sources's
      # normalization -- the run-to-run stability guarantee from issue #7 --
      # is regression-tested.
      - name: Unit tests (Node test runner -- scripts/check-sources)
        run: npm run test:check-sources

      # scripts/ingest-descriptive (#14): robots.txt matching, phone/status
      # extraction, and the new/changed/moved/gone classification. Also Node's
      # test runner, also network-free (the fetcher is injected).
      - name: Unit tests (Node test runner -- scripts/ingest-descriptive)
        run: npm run test:ingest-descriptive

      # scripts/program-benchmark (#66): the Criterion equivalence check, the
      # dangerous-wrongness detectors, abstention and descriptive scoring, and
      # the runner/report -- all against hand-written fixture pairs, no model.
      # Also Node's test runner, also network-free.
      - name: Unit tests (Node test runner -- scripts/program-benchmark)
        run: npm run test:program-benchmark

      # scripts/agentic-extract (#67, #77, #75): the structure-preserving HTML
      # tokeniser, the zero-dependency PDF reader (glyph-coordinate text + ruled
      # table extraction, against a committed Federal Register fixture),
      # dead-URL recovery, eCFR cross-reference resolution, the site-scoped
      # search tool (sitemap + link crawl over committed dhs.wisconsin.gov
      # captures), provenance verification, cost instrumentation, and the whole
      # agent loop end to end against saved fixtures. Also Node's test runner,
      # also network-free and model-free (both the fetcher and the model client
      # are injected).
      - name: Unit tests (Node test runner -- scripts/agentic-extract)
        run: npm run test:agentic-extract

      # scripts/render-fallback (#76): the form-shell unwrap (depth-balanced tag
      # scan, wrapper heuristic, structure survival), the recovery ladder with an
      # injected renderer, and the browser module's robots/hard-deny gate. Also
      # Node's test runner, also network-free and browser-free (an unavailable
      # Chromium is a returned value, not a throw).
      - name: Unit tests (Node test runner -- scripts/render-fallback)
        run: npm run test:render-fallback

      - name: Build
        run: npm run build

      # Keyed on package-lock.json so a Playwright version bump invalidates
      # the cache automatically instead of silently reusing stale browsers.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # With Chromium actually present, exercise scripts/render-fallback's real
      # headless-render path end to end (setContent -> content() -> recovery
      # ladder), no network. The earlier smoke step covered the deterministic
      # unwrap; this covers the browser wiring on headless Linux. It still
      # degrades to a clean skip if the launch fails for an environment reason.
      - name: 'Browser check: scripts/render-fallback headless render (issue #76)'
        run: npm run render-fallback:browser-check

      # playwright.config.ts sets `reuseExistingServer: !process.env.CI`. If
      # CI were ever unset here, Playwright would silently reuse a leftover
      # dev server instead of booting a fresh one against this checkout, and
      # the suite could pass against the wrong build. GitHub Actions sets CI
      # for every step by default -- this asserts that rather than trusting
      # it, so a change to the runner environment fails loudly here instead
      # of producing a quietly-wrong-but-green e2e run.
      - name: Assert CI env var is set
        run: |
          if [ -z "$CI" ]; then
            echo "::error::CI is not set in this job's environment. playwright.config.ts uses reuseExistingServer: !process.env.CI, so without CI set, the e2e run below could reuse a leftover dev server and pass against the wrong build instead of this checkout. Refusing to continue."
            exit 1
          fi
          echo "CI='$CI' -- Playwright will start a fresh server, not reuse one."

      - name: E2E tests (desktop / Pixel 7 / mobile-360)
        run: npm run test:e2e

      - name: E2E tests (production build -- CSP / security headers)
        run: npm run test:e2e:prod
